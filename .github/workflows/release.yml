name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare bundled runtime
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\prepare-runtime.ps1

      - name: Unit tests
        shell: pwsh
        run: |
          node tests/markdown.test.js
          node tests/tools.test.js
          node tests/mcp.test.js

      # 技能放在单独的仓库里。clone 到仓库旁边的 ../ecom-skills，
      # 正好是 config.json 里 extraSkillsDirs 写的位置，build.ps1 会把它快照进 zip。
      # 仓库还没建好时这一步失败不影响出包（用仓库内 skills/ 的版本）。
      - name: 拉取技能库
        shell: pwsh
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/bfsu1666935342-pixel/ecom-skills.git ..\ecom-skills

      - name: Build portable zip
        shell: pwsh
        run: ./build.ps1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EcomWorkbench-*.zip
            dist/SHA256.txt
          generate_release_notes: true
